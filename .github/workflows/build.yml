name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія (напр. 1.0.0). Порожньо — тестова збірка без релізу'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches code
        if: ${{ inputs.version != '' }}
        shell: pwsh
        run: |
          $m = Select-String -Path src/Version.cs -Pattern 'Text = "([^"]+)"'
          $code = $m.Matches[0].Groups[1].Value
          if ($code -ne '${{ inputs.version }}') {
            Write-Error "Версія в коді ($code) не збігається з введеною (${{ inputs.version }}). Оновіть src/Version.cs"
            exit 1
          }

      - name: Built-in Google client
        shell: pwsh
        env:
          GCID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GCSECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ($env:GCID) {
            $id = $env:GCID.Trim(); $sec = "$($env:GCSECRET)".Trim()
            $code = "namespace AutoShorts { static class BuiltInGoogle { public const string ClientId = `"$id`"; public const string ClientSecret = `"$sec`"; } }"
            Set-Content -Path src/BuiltInGoogle.cs -Value $code -Encoding utf8
            Write-Host "Вбудовано Google Client ID"
          } else { Write-Host "Секрету GOOGLE_CLIENT_ID немає — збираю без вбудованого клієнта" }

      - name: Build
        shell: pwsh
        run: ./src/build.ps1

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { throw "Inno Setup не знайдено" }
          $v = (Select-String -Path src/Version.cs -Pattern 'Text = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVer=$v" src/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Помилка збирання інсталятора ($LASTEXITCODE)" }
          Get-Item dist/*.exe | ForEach-Object { Write-Host ("{0}: {1} КБ" -f $_.Name, [math]::Round($_.Length / 1KB)) }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoShorts
          path: |
            dist/AutoShorts-Setup.exe
            dist/AutoShorts.exe

      - name: Create draft release
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          TAG="v$VERSION"
          awk -v v="## $VERSION" '$0==v{f=1;next} f&&/^## /{exit} f{print}' CHANGES.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::У CHANGES.md немає розділу '## $VERSION'"; exit 1; fi
          # опублікований реліз з цим тегом не чіпаємо
          if [ -n "$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.draft == false and .tag_name == \"$TAG\") | .id")" ]; then
            echo "::error::Реліз $TAG уже опубліковано. Збільште версію."; exit 1
          fi
          # старі чернетки цієї версії видаляємо, щоб лишилась одна
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          gh release create "$TAG" dist/AutoShorts-Setup.exe dist/AutoShorts.exe --draft --title "AutoShorts $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
