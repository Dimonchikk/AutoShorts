name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Версія (напр. 1.0.0). Порожньо — тестова збірка без релізу'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version matches code
        if: ${{ inputs.version != '' }}
        shell: pwsh
        run: |
          $m = Select-String -Path src/Version.cs -Pattern 'Text = "([^"]+)"'
          $code = $m.Matches[0].Groups[1].Value
          if ($code -ne '${{ inputs.version }}') {
            Write-Error "Версія в коді ($code) не збігається з введеною (${{ inputs.version }}). Оновіть src/Version.cs"
            exit 1
          }

      - name: Build
        shell: pwsh
        run: ./src/build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoShorts
          path: dist/AutoShorts.exe

      - name: Create draft release
        if: ${{ inputs.version != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          TAG="v$VERSION"
          awk -v v="## $VERSION" '$0==v{f=1;next} f&&/^## /{exit} f{print}' CHANGES.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::У CHANGES.md немає розділу '## $VERSION'"; exit 1; fi
          # опублікований реліз з цим тегом не чіпаємо
          if [ -n "$(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.draft == false and .tag_name == \"$TAG\") | .id")" ]; then
            echo "::error::Реліз $TAG уже опубліковано. Збільште версію."; exit 1
          fi
          # старі чернетки цієї версії видаляємо, щоб лишилась одна
          for id in $(gh api "repos/$REPO/releases" --paginate --jq ".[] | select(.draft == true and .tag_name == \"$TAG\") | .id"); do
            gh api -X DELETE "repos/$REPO/releases/$id"
          done
          gh release create "$TAG" dist/AutoShorts.exe --draft --title "AutoShorts $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
